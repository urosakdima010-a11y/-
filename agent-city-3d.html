<title>Корпорация агентов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: полноэкранная 3D-сцена ИИ-сети; поверх тонкие панели как у консоли мониторинга: часы и метрики слева сверху, журнал событий справа, карточка агента снизу. */
:root {
  --panel: rgba(8, 10, 22, .8); --line: rgba(160, 190, 255, .16); --ink: #e8ecff; --dim: #8b93b8; --faint: #5b6286;
  --live: #ff4f87; --cyan: #5fe3ff; --ok: #59f0a8; --bg: #05060f;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; --sans: 'Manrope', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ui { position: fixed; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.hud { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); padding: 14px 18px 12px; width: min(330px, calc(100vw - 28px)); }
.eyebrow { font: 600 10.5px var(--mono); letter-spacing: 2.4px; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.clock { font: 600 38px/1.05 var(--mono); letter-spacing: -1px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.date { font: 500 12px var(--mono); color: var(--dim); margin-top: 2px; }
.metrics { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 10px 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.metrics div { font: 500 10px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--faint); }
.metrics b { display: block; font: 700 17px var(--mono); color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
.metrics .neg b { color: var(--live); }
.log li.corp, .log li.corp b { color: var(--cyan); }
.org { left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(300px, calc(100vw - 28px)); padding: 12px 14px; max-height: 32vh; overflow-y: auto; }
.org ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 5px; }
.org li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font: 500 11.5px var(--mono); color: var(--dim); }
.org li b { color: var(--ink); font-weight: 700; text-align: right; }
.org li em { grid-column: 1 / -1; font-style: normal; font-size: 10px; color: var(--faint); }
.note { font: 500 10.5px/1.45 var(--mono); color: var(--faint); margin-top: 10px; }
.note em { font-style: normal; color: var(--live); }
.log { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); width: min(400px, calc(100vw - 28px)); padding: 12px 14px; max-height: 52vh; overflow: hidden; }
.log ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.log li { font: 400 11.5px/1.4 var(--mono); color: var(--dim); display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
.log li time { color: var(--faint); font-variant-numeric: tabular-nums; }
.log li b { color: var(--ink); font-weight: 600; }
.log li.live, .log li.live b { color: var(--live); }
.card { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100vw - 28px)); padding: 14px 18px 16px; }
.card h3 { font: 800 19px var(--sans); margin: 4px 0 6px; letter-spacing: -.3px; display: flex; align-items: center; gap: 10px; }
.card h3 i { width: 10px; height: 10px; border-radius: 50%; }
.card p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--dim); }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.kv div { font: 500 10px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--faint); }
.kv b { display: block; font: 600 14px var(--mono); color: var(--ink); letter-spacing: 0; margin-top: 3px; text-transform: none; }
.state { margin-top: 10px; font: 500 12px var(--mono); color: var(--cyan); }
.state.live { color: var(--live); }
.close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--dim); font: 600 18px var(--mono); cursor: pointer; padding: 4px 8px; }
.close:focus-visible { outline: 2px solid var(--cyan); border-radius: 6px; }
.tag { position: fixed; z-index: 3; transform: translate(-50%, -100%); pointer-events: none; text-align: center; white-space: nowrap; }
.tag b { display: block; font: 600 10px var(--mono); letter-spacing: 1.6px; text-transform: uppercase; color: rgba(232,236,255,.82); text-shadow: 0 0 8px rgba(0,0,0,.9); }
.tag small { display: block; font: 500 10px var(--mono); color: var(--cyan); margin-top: 2px; text-shadow: 0 0 8px rgba(0,0,0,.9); }
.tag.live small, .tag.live b { color: var(--live); }
.welcome { position: fixed; z-index: 8; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font: 600 12px var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 999px; backdrop-filter: blur(14px); max-width: calc(100vw - 32px); text-align: center; }
@media (max-width: 720px) {
  .hud { padding: 10px 12px; width: calc(100vw - 28px); }
  .clock { font-size: 26px; } .metrics b { font-size: 14px; }
  .log { top: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); max-height: 24vh; }
  .log li { grid-template-columns: 54px 1fr; font-size: 10.5px; }
  body.sel .log { display: none; }
  .note { display: none; }
  .org { display: none; }
}
</style>

<canvas id="c" aria-label="3D-корпорация ИИ-агентов"></canvas>
<section class="ui hud">
  <div class="eyebrow"><i></i>Корпорация агентов · онлайн</div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date"></div>
  <div class="metrics">
    <div><b id="mHead">0</b>штат</div>
    <div><b id="mBud">0</b>бюджет</div>
    <div><b id="mTasks">0</b>задач сегодня</div>
    <div><b id="mVid">0</b>роликов</div>
    <div><b id="mLoad">0%</b>нагрузка</div>

</section>
<section class="ui log" aria-live="polite"><div class="eyebrow">Журнал корпорации</div><ul id="log"></ul></section>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
// ================= корпорация: базовый штат =================
const DEPT_NAME = { c: 'Ядро', t: 'Кластер @ii_vedet', v: 'Видеокластер', b: 'Деловой кластер', l: 'Знания и расписание', h: 'Кадры и финансы', s: 'Поддержка', m: 'Продажи', q: 'Безопасность', e: 'Обучение агентов' };
const DEPT_HUE = { c: 265, t: 335, v: 30, b: 170, l: 200, h: 50, s: 120, m: 15, q: 350, e: 85 };
const DEPT_WHO = { t: 'Помогает делать ролики @ii_vedet.', v: 'Работает над видеопроизводством.', b: 'Закрывает деловые задачи.', l: 'Работает со знаниями и расписанием.', s: 'Отвечает пользователям и разбирает обращения.', m: 'Ищет клиентов и ведёт сделки.', q: 'Следит за безопасностью и качеством.', e: 'Обучает других агентов.', h: 'Обслуживает штат и бюджет.' };
const POOL = {
  t: ['Копирайтер', 'Ресёрчер трендов', 'Аниматор', 'Редактор', 'Хэштег-аналитик'], v: ['Цветокоррекция', 'Субтитры', 'Звукорежиссёр'],
  b: ['Бухгалтер', 'Верстальщик', 'Юрист-ассистент', 'Аналитик продаж'], l: ['Архивариус', 'Переводчик', 'Календарь-менеджер'],
  s: ['Оператор чата', 'Модератор', 'Служба отзывов'], m: ['Лидогенерация', 'Менеджер сделок'], q: ['Аудитор', 'Мониторинг'], e: ['Тренер агентов', 'Методист'],
  h: ['Рекрутер'],
};
const NEW_DEPTS = ['s', 'm', 'q', 'e'];
const BASE = [
  { id: 'dir', d: 'c', n: 'Директор', c: '#c9b6ff', who: 'Центральное ядро: принимает задачи, раздаёт их агентам и собирает результат.' },
  { id: 'hr', d: 'h', n: 'Кадры', c: '#ffd166', who: 'Подбирает и увольняет агентов, следит за штатом.' },
  { id: 'fin', d: 'h', n: 'Финансы', c: '#59f0a8', who: 'Ведёт бюджет вычислений и согласует найм.' },
  { id: 'prod', d: 't', n: 'Продюсер', c: '#ff4f87', who: 'Ведёт ролик @ii_vedet от задания зрителя до публикации.' },
  { id: 'scout', d: 't', n: 'Скаут', c: '#5fe3ff', who: 'Читает комментарии и ищет тренды.' },
  { id: 'anal', d: 't', n: 'Аналитик', c: '#7aa8ff', who: 'Считает просмотры, досмотры и делает выводы.' },
  { id: 'exec', d: 't', n: 'Исполнитель', c: '#59f0a8', who: 'Решает задание зрителя по-настоящему.' },
  { id: 'script', d: 't', n: 'Сценарист', c: '#ffd166', who: 'Раскладывает результат по сценам и репликам.' },
  { id: 'mont', d: 't', n: 'Монтажёр', c: '#ff8a5c', who: 'Собирает ролик: анимация, озвучка, рендер.' },
  { id: 'ctrl', d: 't', n: 'Контролёр', c: '#f25f5c', who: 'Независимо проверяет кадры, факты и длину.' },
  { id: 'comm', d: 't', n: 'Комьюнити', c: '#e07bff', who: 'Подпись, хэштеги, ответы на комментарии.' },
  { id: 'tt', d: 't', n: 'TikTok', c: '#ff6fb5', who: 'Ведёт TikTok целиком: идеи, план, статистика.' },
  { id: 'vid', d: 'v', n: 'Монтаж видео', c: '#ffa94d', who: 'Монтирует видео из ваших фото и клипов.' },
  { id: 'vzero', d: 'v', n: 'Видео с нуля', c: '#ffcf70', who: 'Создаёт видео без исходников.' },
  { id: 'site', d: 'b', n: 'Сайт и бот', c: '#4dd4c6', who: 'Строит сайты и страницы с ИИ-чатом.' },
  { id: 'smeta', d: 'b', n: 'Смета', c: '#8ad46a', who: 'Считает сметы и расходы.' },
  { id: 'docs', d: 'b', n: 'Документы', c: '#9fb4ff', who: 'Пишет письма, планы и отчёты.' },
  { id: 'res', d: 'l', n: 'Исследования', c: '#6fd0ff', who: 'Изучает темы по многим источникам.' },
  { id: 'sec', d: 'l', n: 'Секретарь', c: '#b8a6ff', who: 'Встречи, напоминания, будильники.' },
];
const PIPE = [['scout', 'задания и тренды'], ['anal', 'статистика'], ['exec', 'решение задания'], ['script', 'сценарий'], ['mont', 'монтаж'], ['ctrl', 'проверка'], ['comm', 'подпись и теги']];
const JOBS = {
  tt: ['план публикаций', 'идеи роликов', 'отчёт по охватам'], vid: ['монтаж из фото', 'нарезка клипов'], vzero: ['анимация', 'озвучка'],
  site: ['лендинг', 'чат-бот', 'правки страницы'], smeta: ['смета', 'пересчёт расходов'], docs: ['письмо', 'план недели', 'отчёт'],
  res: ['сравнение вариантов', 'разбор темы'], sec: ['напоминание', 'встреча'], hr: ['разбор штата', 'оценка эффективности'], fin: ['сверка бюджета', 'отчёт по расходам'],
};
const DJOBS = { t: ['набросок поста', 'проверка идей'], v: ['правка видео', 'дорожка звука'], b: ['расчёт', 'документ'], l: ['сводка знаний', 'перевод'], s: ['ответ пользователю', 'разбор обращения'], m: ['список клиентов', 'коммерческое предложение'], q: ['проверка доступов', 'аудит качества'], e: ['обучающий курс', 'тест для агентов'], h: ['разбор штата'] };
const jobsFor = a => JOBS[a.id] || DJOBS[a.d] || ['задача'];
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ================= модель корпорации =================
const KEY = 'agent-city-corp-v1', MAX = 48, START_BUDGET = 600;
const today = () => new Date().toDateString();
const st = { day: today(), tasksToday: 0, videos: 0, budget: START_BUDGET, depts: ['t', 'v', 'b', 'l', 'h'], hired: [], seq: 0, hiredTotal: 0, firedTotal: 0, agents: {}, load: {}, inc: 0, cost: 0 };
let saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
if (saved && saved.v === 1) Object.assign(st, saved.st);
const defs = () => BASE.concat(st.hired);
const heads = () => defs().length - 1;
const ensureStats = () => defs().forEach(a => { st.agents[a.id] = Object.assign({ lvl: 1, xp: 0, done: 0 }, st.agents[a.id]); });
ensureStats();
const need = l => 4 + l * 3;
const roleOf = l => l >= 10 ? 'руководитель' : l >= 5 ? 'старший' : l >= 2 ? 'специалист' : 'стажёр';
const hireCost = () => 90 + heads() * 4;
let logLine = () => {};
function grow(id, n, quiet) {
  const s = st.agents[id]; if (!s) return; s.xp += n;
  while (s.xp >= need(s.lvl)) {
    s.xp -= need(s.lvl); s.lvl++;
    if (!quiet) { const nm = (defs().find(d => d.id === id) || {}).n; logLine(`<b>${esc(nm)}</b>: ${s.lvl === 5 || s.lvl === 10 ? 'повышен до роли «' + roleOf(s.lvl) + '»' : 'мощность выросла до ' + s.lvl}`); }
  }
}
function countTask() { if (st.day !== today()) { st.day = today(); st.tasksToday = 0; } st.tasksToday++; }
function earn(id, base) { const g = base + (st.agents[id] ? st.agents[id].lvl * 1.5 : 0); st.budget += g; st.inc += g; }
function reward(id, n) { if (!st.agents[id]) return; st.agents[id].done++; grow(id, n); earn(id, 11); }

// --- решения отдела кадров (одна и та же логика для живого времени и для офлайна)
function titleFor(dept) {
  const pool = POOL[dept] || ['Агент'], base = pool[Math.floor(Math.random() * pool.length)];
  const same = defs().filter(d => d.n === base || d.n.startsWith(base + ' ')).length;
  return same ? base + ' ' + (same + 1) : base;
}
function pickDept() {
  const open = st.depts.filter(d => d !== 'h' || (Math.random() < .12 && st.hired.filter(x => x.d === 'h').length < 3));
  const w = open.map(d => 1 + (st.load[d] || 0) * 4), sum = w.reduce((a, b) => a + b, 0); let r = Math.random() * sum;
  for (let i = 0; i < open.length; i++) { r -= w[i]; if (r <= 0) return open[i]; }
  return open[0];
}
function hrDecide(nowMs) {
  if (st.budget < 40) {
    const h = st.hired.slice().sort((a, b) => st.agents[a.id].done / (nowMs - a.born + 6e4) - st.agents[b.id].done / (nowMs - b.born + 6e4))[0];
    if (h) return { type: 'fire', id: h.id, why: 'сокращение из-за дефицита бюджета' };
  }
  for (const h of st.hired) if ((nowMs - h.born) / 6e4 > 25 && st.agents[h.id].done < 2 && Math.random() < .4) return { type: 'fire', id: h.id, why: 'низкая эффективность по итогам оценки' };
  const free = NEW_DEPTS.filter(d => !st.depts.includes(d));
  if (st.budget > 1500 && heads() >= 22 && free.length && Math.random() < .35) return { type: 'opendept', dept: free[0], cost: 200 };
  if (st.budget > hireCost() + 250 && heads() < MAX) return { type: 'hire', dept: pickDept(), cost: hireCost() };
  return null;
}
const mkColor = d => '#' + new THREE.Color().setHSL(((DEPT_HUE[d] || 200) + (Math.random() * 30 - 15) + 360) % 360 / 360, .7, .65).getHexString();
function applyAction(act, live, nowMs) {
  if (act.type === 'fire') {
    const i = st.hired.findIndex(h => h.id === act.id); if (i < 0) return null;
    const def = st.hired.splice(i, 1)[0]; delete st.agents[def.id]; st.firedTotal++;
    return Object.assign({ def }, act);
  }
  let dept = act.dept;
  if (act.type === 'opendept') st.depts.push(dept);
  const lead = act.type === 'opendept';
  const def = { id: 'h' + (++st.seq), n: lead ? 'Руководитель: ' + DEPT_NAME[dept] : titleFor(dept), d: dept, c: mkColor(dept), who: (DEPT_WHO[dept] || '') + ' Принят в штат автоматически.', born: nowMs };
  st.hired.push(def); st.agents[def.id] = { lvl: lead ? 4 : 1, xp: 0, done: 0 }; st.budget -= act.cost; st.cost += act.cost; st.hiredTotal++;
  return Object.assign({ def }, act);
}

// --- пока страница была закрыта
let welcome = '';
if (st.day !== today()) { st.day = today(); st.tasksToday = 0; }
if (saved && saved.savedAt) {
  const away = Math.min(3 * 86400e3, Math.max(0, Date.now() - saved.savedAt));
  if (away > 120e3) {
    const midnight = new Date().setHours(0, 0, 0, 0);
    const sum = { tasks: 0, vids: 0, hired: 0, fired: 0, dept: 0 };
    for (let t = saved.savedAt + 120e3; t <= saved.savedAt + away; t += 120e3) {
      const hc = heads(), tasks = hc * .58;
      const inc = tasks * 12.5, up = hc * 5; st.budget += inc - up; st.inc += inc; st.cost += up;
      const n = Math.floor(tasks + Math.random());
      for (let i = 0; i < n; i++) { const arr = defs().slice(1), a = arr[Math.floor(Math.random() * arr.length)]; st.agents[a.id].done++; grow(a.id, 1, true); }
      sum.tasks += n; if (t >= midnight) st.tasksToday += n; const v = Math.random() < .28 ? 1 : 0; st.videos += v; sum.vids += v;
      if (st.budget > 5000) { st.budget -= 2000; defs().forEach(d => grow(d.id, 3, true)); }
      const act = hrDecide(t); if (act) { const r = applyAction(act, false, t); if (r) { act.type === 'fire' ? sum.fired++ : sum.hired++; if (act.type === 'opendept') sum.dept++; } }
    }
    ensureStats();
    welcome = `Пока вас не было: ${sum.tasks} задач, ${sum.vids} роликов, нанято ${sum.hired}, уволено ${sum.fired}` + (sum.dept ? `, открыто отделов: ${sum.dept}` : '');
  }
}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ v: 1, st, savedAt: Date.now() })); } catch (e) {} };

// ================= рендер =================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();

const packets = [];
function send(from, to, label, onArrive, quiet) {
  if (!from || !to) { if (onArrive) onArrive(); return; }
  const curve = arc(from, to), len = curve.getLength();
  const head = glow(from.col, 1.6, 1); scene.add(head);
  const trail = []; for (let i = 0; i < 7; i++) { const s = glow(from.col, 1.2 - i * .13, .5 - i * .06); scene.add(s); trail.push(s); }
  packets.push({ from, to, t: 0, dur: Math.max(2.4, len / 9), head, trail, onArrive });
  from.pulse = 1;
  if (!quiet) logLine(`<b>${esc(from.n)}</b> → <b>${esc(to.n)}</b>  ${esc(label)}`);
}
function stepPackets(dt) {
  for (let i = packets.length - 1; i >= 0; i--) {
    const p = packets[i]; p.t += dt / p.dur;
    const curve = arc(p.from, p.to);
    const e = Math.min(1, p.t), te = e < .5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
    p.head.position.copy(curve.getPoint(te));
    p.trail.forEach((s, j) => s.position.copy(curve.getPoint(Math.max(0, te - (j + 1) * .018))));
    if (p.t >= 1) { scene.remove(p.head); p.trail.forEach(s => scene.remove(s)); packets.splice(i, 1); if (p.onArrive) p.onArrive(); }
  }
}
