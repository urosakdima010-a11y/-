<title>Город агентов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@500;700;800&display=swap">
<style>
/* Layout: полноэкранная 3D-сцена ИИ-сети; поверх тонкие панели как у консоли мониторинга: часы и метрики слева сверху, журнал событий справа, карточка агента снизу. */
:root {
  --panel: rgba(8, 10, 22, .8); --line: rgba(160, 190, 255, .16); --ink: #e8ecff; --dim: #8b93b8; --faint: #5b6286;
  --live: #ff4f87; --cyan: #5fe3ff; --ok: #59f0a8; --bg: #05060f;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; --sans: 'Manrope', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ui { position: fixed; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.hud { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); padding: 14px 18px 12px; width: min(330px, calc(100vw - 28px)); }
.eyebrow { font: 600 10.5px var(--mono); letter-spacing: 2.4px; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.clock { font: 600 38px/1.05 var(--mono); letter-spacing: -1px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.date { font: 500 12px var(--mono); color: var(--dim); margin-top: 2px; }
.metrics { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 6px 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.metrics div { font: 500 10px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--faint); }
.metrics b { display: block; font: 700 17px var(--mono); color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
.note { font: 500 10.5px/1.45 var(--mono); color: var(--faint); margin-top: 10px; }
.note em { font-style: normal; color: var(--live); }
.log { top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); width: min(380px, calc(100vw - 28px)); padding: 12px 14px; max-height: 46vh; overflow: hidden; }
.log ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.log li { font: 400 11.5px/1.4 var(--mono); color: var(--dim); display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
.log li time { color: var(--faint); font-variant-numeric: tabular-nums; }
.log li b { color: var(--ink); font-weight: 600; }
.log li.live, .log li.live b { color: var(--live); }
.card { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100vw - 28px)); padding: 14px 18px 16px; }
.card h3 { font: 800 19px var(--sans); margin: 4px 0 6px; letter-spacing: -.3px; display: flex; align-items: center; gap: 10px; }
.card h3 i { width: 10px; height: 10px; border-radius: 50%; }
.card p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--dim); }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.kv div { font: 500 10px var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--faint); }
.kv b { display: block; font: 600 14px var(--mono); color: var(--ink); letter-spacing: 0; margin-top: 3px; text-transform: none; }
.state { margin-top: 10px; font: 500 12px var(--mono); color: var(--cyan); }
.state.live { color: var(--live); }
.close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--dim); font: 600 18px var(--mono); cursor: pointer; padding: 4px 8px; }
.close:focus-visible { outline: 2px solid var(--cyan); border-radius: 6px; }
.tag { position: fixed; z-index: 3; transform: translate(-50%, -100%); pointer-events: none; text-align: center; white-space: nowrap; }
.tag b { display: block; font: 600 10px var(--mono); letter-spacing: 1.6px; text-transform: uppercase; color: rgba(232,236,255,.82); text-shadow: 0 0 8px rgba(0,0,0,.9); }
.tag small { display: block; font: 500 10px var(--mono); color: var(--cyan); margin-top: 2px; text-shadow: 0 0 8px rgba(0,0,0,.9); }
.tag.live small, .tag.live b { color: var(--live); }
.welcome { position: fixed; z-index: 8; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font: 600 12px var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 999px; backdrop-filter: blur(14px); max-width: calc(100vw - 32px); text-align: center; }
@media (max-width: 720px) {
  .hud { padding: 10px 12px; width: calc(100vw - 28px); }
  .clock { font-size: 26px; } .metrics b { font-size: 14px; }
  .log { top: auto; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); max-height: 24vh; }
  .log li { grid-template-columns: 54px 1fr; font-size: 10.5px; }
  body.sel .log { display: none; }
  .note { display: none; }
}
</style>

<canvas id="c" aria-label="3D-город ИИ-агентов"></canvas>
<section class="ui hud">
  <div class="eyebrow"><i></i>Город агентов · онлайн</div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date"></div>
  <div class="metrics">
    <div><b id="mOn">17</b>агентов</div>
    <div><b id="mTasks">0</b>задач сегодня</div>
    <div><b id="mVid">0</b>роликов</div>
    <div><b id="mLoad">0%</b>нагрузка</div>
  </div>
  <div class="note">Фоновая активность сети — модель. <em>LIVE</em> — реальная работа агента сейчас.</div>
</section>
<section class="ui log" aria-live="polite"><div class="eyebrow">Журнал сети</div><ul id="log"></ul></section>
<aside class="ui card" id="card" hidden></aside>
<div id="tags"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
// ================= агенты =================
const DIST = { c: 'Ядро', t: 'Кластер @ii_vedet', v: 'Видеокластер', b: 'Деловой кластер', l: 'Знания и расписание' };
const AG = [
  { id: 'dir', d: 'c', n: 'Директор', c: '#c9b6ff', who: 'Центральное ядро: принимает задачи, раздаёт их агентам и собирает результат.' },
  { id: 'prod', d: 't', n: 'Продюсер', c: '#ff4f87', who: 'Ведёт ролик @ii_vedet от задания зрителя до публикации.' },
  { id: 'scout', d: 't', n: 'Скаут', c: '#5fe3ff', who: 'Читает комментарии и ищет тренды.' },
  { id: 'anal', d: 't', n: 'Аналитик', c: '#7aa8ff', who: 'Считает просмотры, досмотры и делает выводы.' },
  { id: 'exec', d: 't', n: 'Исполнитель', c: '#59f0a8', who: 'Решает задание зрителя по-настоящему.' },
  { id: 'script', d: 't', n: 'Сценарист', c: '#ffd166', who: 'Раскладывает результат по сценам и репликам.' },
  { id: 'mont', d: 't', n: 'Монтажёр', c: '#ff8a5c', who: 'Собирает ролик: анимация, озвучка, рендер.' },
  { id: 'ctrl', d: 't', n: 'Контролёр', c: '#f25f5c', who: 'Независимо проверяет кадры, факты и длину.' },
  { id: 'comm', d: 't', n: 'Комьюнити', c: '#e07bff', who: 'Подпись, хэштеги, ответы на комментарии.' },
  { id: 'tt', d: 't', n: 'TikTok', c: '#ff6fb5', who: 'Ведёт TikTok целиком: идеи, план, статистика.' },
  { id: 'vid', d: 'v', n: 'Монтаж видео', c: '#ffa94d', who: 'Монтирует видео из ваших фото и клипов.' },
  { id: 'vzero', d: 'v', n: 'Видео с нуля', c: '#ffcf70', who: 'Создаёт видео без исходников.' },
  { id: 'site', d: 'b', n: 'Сайт и бот', c: '#4dd4c6', who: 'Строит сайты и страницы с ИИ-чатом.' },
  { id: 'smeta', d: 'b', n: 'Смета', c: '#8ad46a', who: 'Считает сметы и расходы.' },
  { id: 'docs', d: 'b', n: 'Документы', c: '#9fb4ff', who: 'Пишет письма, планы и отчёты.' },
  { id: 'res', d: 'l', n: 'Исследования', c: '#6fd0ff', who: 'Изучает темы по многим источникам.' },
  { id: 'sec', d: 'l', n: 'Секретарь', c: '#b8a6ff', who: 'Встречи, напоминания, будильники.' },
];
const byId = {}; AG.forEach(a => byId[a.id] = a);
const PIPE = [['scout', 'задания и тренды'], ['anal', 'статистика'], ['exec', 'решение задания'], ['script', 'сценарий'], ['mont', 'монтаж'], ['ctrl', 'проверка'], ['comm', 'подпись и теги']];
const JOBS = {
  tt: ['план публикаций', 'идеи роликов', 'отчёт по охватам'], vid: ['монтаж из фото', 'нарезка клипов'], vzero: ['анимация', 'озвучка'],
  site: ['лендинг', 'чат-бот', 'правки страницы'], smeta: ['смета', 'пересчёт расходов'], docs: ['письмо', 'план недели', 'отчёт'],
  res: ['сравнение вариантов', 'разбор темы'], sec: ['напоминание', 'встреча'],
};
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ================= состояние (хранится в этом браузере) =================
const KEY = 'agent-city-live-v1';
const today = () => new Date().toDateString();
const st = { day: today(), tasksToday: 0, videos: 0, agents: {} };
let saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
if (saved && saved.v === 1) Object.assign(st, saved.st);
AG.forEach(a => st.agents[a.id] = Object.assign({ lvl: 1, xp: 0, done: 0 }, st.agents[a.id]));
const need = l => 4 + l * 3;
function grow(id, n, quiet) { const s = st.agents[id]; s.xp += n; while (s.xp >= need(s.lvl)) { s.xp -= need(s.lvl); s.lvl++; if (!quiet) logLine(`<b>${byId[id].n}</b>: мощность выросла до ${s.lvl}`); } }
function reward(id, n) { st.agents[id].done += 1; grow(id, n); }
function countTask() { if (st.day !== today()) { st.day = today(); st.tasksToday = 0; } st.tasksToday++; }
let welcome = '';
if (st.day !== today()) { st.day = today(); st.tasksToday = 0; }
if (saved && saved.savedAt) {
  const away = Math.min(3 * 86400, Math.max(0, (Date.now() - saved.savedAt) / 1000));
  const n = Math.floor(away / 40);
  if (n > 0) {
    for (let i = 0; i < n; i++) { const id = AG[1 + Math.floor(Math.random() * (AG.length - 1))].id; st.agents[id].done++; grow(id, 1, true); }
    const vids = Math.floor(n / 16); st.videos += vids;
    const sinceMidnight = (Date.now() - new Date().setHours(0, 0, 0, 0)) / 1000;
    st.tasksToday += Math.floor(Math.min(away, sinceMidnight) / 40);
    welcome = `Пока вас не было, сеть выполнила ${n} задач и выпустила ${vids} роликов`;
  }
}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ v: 1, st, savedAt: Date.now() })); } catch (e) {} };

// ================= рендер =================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060f, .011);
const camera = new THREE.PerspectiveCamera(38, 1, .1, 600);
camera.position.set(58, 34, 58);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(0, 6, 0); controls.enableDamping = true; controls.dampingFactor = .06;
controls.maxPolarAngle = 1.45; controls.minDistance = 18; controls.maxDistance = 140;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotate = !reduce; controls.autoRotateSpeed = .22;
let idleT = 0; controls.addEventListener('start', () => { controls.autoRotate = false; idleT = 0; });

const hemi = new THREE.HemisphereLight(0x9fb6ff, 0x0a0c18, .35); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dd, 1); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50, near: 1, far: 200 }); sun.shadow.bias = -.0005;
scene.add(sun, sun.target);

const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(512, 512), .9, .55, .62);
composer.addPass(bloom);

// --- земля: тёмный металл с тонкой сеткой
const ground = new THREE.Mesh(new THREE.CircleGeometry(160, 96), new THREE.MeshStandardMaterial({ color: 0x0a0d1a, metalness: .75, roughness: .42 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(200, 100, 0x2b3566, 0x1a2140); grid.material.transparent = true; grid.material.opacity = .22; grid.position.y = .01; scene.add(grid);
function ringLine(r, color, op) {
  const pts = []; for (let i = 0; i <= 160; i++) { const t = i / 160 * Math.PI * 2; pts.push(new THREE.Vector3(Math.sin(t) * r, .03, Math.cos(t) * r)); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color, transparent: true, opacity: op })));
}
ringLine(13, 0x5fe3ff, .35); ringLine(16.5, 0x5fe3ff, .12); ringLine(34, 0x7a6bff, .14);

// --- светящаяся точка-спрайт
const glowTex = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(cv); })();
const glow = (color, size, op) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: op == null ? 1 : op, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.setScalar(size); return s; };

// --- фасады: тонкие полосы светящихся окон
function facadeTex(seed) {
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 256; const g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 64, 256);
  let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let y = 0; y < 32; y++) for (let x = 0; x < 6; x++) { if (r() < .42) { g.fillStyle = `rgba(255,255,255,${.35 + r() * .65})`; g.fillRect(3 + x * 10, 3 + y * 8, 7, 3); } }
  g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(0, 0, 1, 256); g.fillRect(63, 0, 1, 256);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

// --- размещение: кластеры по кругу, два ряда для глубины
const order = []; let k = 0;
['t', 'v', 'b', 'l'].forEach(d => { AG.filter(a => a.d === d).forEach(a => order.push([a, k++])); k += 1.2; });
const TOTAL = k;
const pickables = [], towerMats = [];
AG.forEach((a, i) => {
  a.col = new THREE.Color(a.c);
  let pos, w;
  if (a.id === 'dir') { pos = new THREE.Vector3(0, 0, 0); w = 6.5; }
  else {
    const slot = order.find(o => o[0] === a)[1], ang = slot / TOTAL * Math.PI * 2, r = slot % 2 ? 29 : 22.5;
    pos = new THREE.Vector3(Math.sin(ang) * r, 0, Math.cos(ang) * r); w = 3.6 + (slot % 3) * .5; a.ang = ang;
  }
  a.pos = pos; a.w = w;
  const g = new THREE.Group(); g.position.copy(pos); if (a.ang != null) g.rotation.y = a.ang; scene.add(g);
  const tex = facadeTex(1000 + i * 7919);
  const side = new THREE.MeshStandardMaterial({ color: 0x0b1022, metalness: .9, roughness: .18, emissive: a.col.clone().lerp(new THREE.Color(0xffffff), .35), emissiveMap: tex, emissiveIntensity: .6 });
  const top = new THREE.MeshStandardMaterial({ color: 0x0a0e1e, metalness: .5, roughness: .6 });
  towerMats.push(side); a.tex = tex;
  const box = new THREE.BoxGeometry(1, 1, 1); box.translate(0, .5, 0);
  const tower = new THREE.Mesh(box, [side, side, top, top, side, side]); tower.scale.set(w, 1, w); tower.castShadow = tower.receiveShadow = true;
  tower.userData.id = a.id; pickables.push(tower); g.add(tower); a.tower = tower;
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(box), new THREE.LineBasicMaterial({ color: a.col, transparent: true, opacity: .55 }));
  edges.scale.copy(tower.scale); g.add(edges); a.edges = edges;
  const crown = new THREE.Mesh(new THREE.BoxGeometry(w + .02, .12, w + .02), new THREE.MeshBasicMaterial({ color: a.col, toneMapped: false })); g.add(crown); a.crown = crown;
  const base = new THREE.Mesh(new THREE.RingGeometry(w * .78, w * .82, 64), new THREE.MeshBasicMaterial({ color: a.col, transparent: true, opacity: .5, toneMapped: false }));
  base.rotation.x = -Math.PI / 2; base.position.y = .04; g.add(base);
  // ИИ-ядро над башней
  const core = new THREE.Group(); scene.add(core); a.core = core;
  const R = a.id === 'dir' ? 1.6 : .7;
  const orb = new THREE.Mesh(new THREE.SphereGeometry(R * .55, 32, 24), new THREE.MeshBasicMaterial({ color: a.col.clone().lerp(new THREE.Color(0xffffff), .35), toneMapped: false }));
  const shell = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(R, 1)), new THREE.LineBasicMaterial({ color: a.col, transparent: true, opacity: .55 }));
  const ring1 = new THREE.Mesh(new THREE.TorusGeometry(R * 1.45, .025, 6, 96), new THREE.MeshBasicMaterial({ color: a.col, toneMapped: false, transparent: true, opacity: .8 }));
  const ring2 = ring1.clone(); ring2.rotation.x = Math.PI / 2.4;
  const halo = glow(a.col, R * 6, .55);
  const live = new THREE.Mesh(new THREE.TorusGeometry(R * 2, .05, 8, 96), new THREE.MeshBasicMaterial({ color: 0xff4f87, toneMapped: false, transparent: true }));
  live.rotation.x = Math.PI / 2; live.visible = false;
  orb.userData.id = a.id; pickables.push(orb);
  core.add(halo, orb, shell, ring1, ring2, live);
  Object.assign(a, { orb, shell, ring1, ring2, halo, live, R, h: 0, busy: 0, say: '', pending: false, next: 8 + Math.random() * 50 });
  if (a.id === 'dir') { a.extra = [0, 1].map(j => { const rr = new THREE.Mesh(new THREE.TorusGeometry(R * (2.4 + j * .7), .03, 6, 128), ring1.material); rr.rotation.x = Math.PI / 2 + (j ? .5 : -.4); core.add(rr); return rr; }); }
  const tag = document.createElement('div'); tag.className = 'tag'; document.getElementById('tags').appendChild(tag); a.tag = tag;
});
const heightOf = a => (a.id === 'dir' ? 16 : 6) + Math.min(40, (st.agents[a.id].lvl - 1) * 1.6);
AG.forEach(a => a.h = heightOf(a));
const corePos = (a, out) => out.set(a.pos.x, a.h + (a.id === 'dir' ? 4 : 2.4), a.pos.z);

// --- постоянные линии связи с ядром
const dir = byId.dir;
function arc(a, b) {
  const p0 = corePos(a, new THREE.Vector3()), p2 = corePos(b, new THREE.Vector3());
  const mid = p0.clone().add(p2).multiplyScalar(.5); mid.y = Math.max(p0.y, p2.y) + 4 + p0.distanceTo(p2) * .22;
  return new THREE.QuadraticBezierCurve3(p0, mid, p2);
}
const links = AG.filter(a => a.id !== 'dir').map(a => {
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(new Array(41).fill(0).map(() => new THREE.Vector3())),
    new THREE.LineBasicMaterial({ color: a.col, transparent: true, opacity: .14, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(line); return [a, line];
});
function updateLinks() { links.forEach(([a, line]) => { const pts = arc(a, dir).getPoints(40), pos = line.geometry.attributes.position; pts.forEach((p, i) => pos.setXYZ(i, p.x, p.y, p.z)); pos.needsUpdate = true; }); }
updateLinks();

// --- пыль в воздухе
const dust = (() => {
  const n = 700, geo = new THREE.BufferGeometry(), arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const r = Math.random() * 60, t = Math.random() * Math.PI * 2; arr[i * 3] = Math.sin(t) * r; arr[i * 3 + 1] = Math.random() * 40; arr[i * 3 + 2] = Math.cos(t) * r; }
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const p = new THREE.Points(geo, new THREE.PointsMaterial({ size: .18, map: glowTex, color: 0x9fb6ff, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(p); return p;
})();

// ================= журнал =================
const logEl = document.getElementById('log'); const lines = [];
const hhmmss = d => d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function logLine(html, live) {
  lines.unshift({ html, live, t: hhmmss(new Date()) }); lines.length = Math.min(lines.length, 9);
  logEl.innerHTML = lines.map(l => `<li class="${l.live ? 'live' : ''}"><time>${l.t}</time><span>${l.html}</span></li>`).join('');
}

// ================= пакеты данных =================
const packets = [];
function send(from, to, label, onArrive) {
  const curve = arc(from, to), len = curve.getLength();
  const head = glow(from.col, 1.6, 1); scene.add(head);
  const trail = []; for (let i = 0; i < 7; i++) { const s = glow(from.col, 1.2 - i * .13, .5 - i * .06); scene.add(s); trail.push(s); }
  packets.push({ curve, t: 0, dur: Math.max(2.4, len / 9), head, trail, onArrive });
  from.pulse = 1;
  logLine(`<b>${from.n}</b> → <b>${to.n}</b>  ${esc(label)}`);
}
function stepPackets(dt) {
  for (let i = packets.length - 1; i >= 0; i--) {
    const p = packets[i]; p.t += dt / p.dur;
    const e = Math.min(1, p.t), te = e < .5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;
    p.head.position.copy(p.curve.getPoint(te));
    p.trail.forEach((s, j) => s.position.copy(p.curve.getPoint(Math.max(0, te - (j + 1) * .018))));
    if (p.t >= 1) { scene.remove(p.head); p.trail.forEach(s => scene.remove(s)); packets.splice(i, 1); if (p.onArrive) p.onArrive(); }
  }
}

// ================= поведение агентов (реальное время) =================
let pipeBusy = false;
function work(a, sec, label, then) { a.busy = sec; a.say = label; a.then = then; a.pulse = 1; }
function videoRun() {
  pipeBusy = true; const p = byId.prod;
  send(dir, p, 'задание зрителя', () => work(p, 20 + Math.random() * 15, 'разбирает задание', () => step(0, p)));
}
function step(i, from) {
  if (i >= PIPE.length) {
    send(from, byId.prod, 'материалы ролика', () => work(byId.prod, 25, 'публикация', () =>
      send(byId.prod, dir, 'ролик готов', () => { st.videos++; countTask(); reward('prod', 2); grow('dir', 1); pipeBusy = false; persist(); })));
    return;
  }
  const [id, label] = PIPE[i], to = byId[id];
  send(from, to, label, () => work(to, 25 + Math.random() * 45, label, () => { countTask(); reward(id, 1); step(i + 1, to); }));
}
function soloRun(a) {
  a.pending = true;
  const list = JOBS[a.id], job = list[Math.floor(Math.random() * list.length)];
  send(dir, a, job, () => work(a, 30 + Math.random() * 70, job, () =>
    send(a, dir, 'результат: ' + job, () => { countTask(); reward(a.id, 1); grow('dir', .3, true); a.pending = false; persist(); })));
}
function tick(dt) {
  AG.forEach(a => {
    if (a.busy > 0) { a.busy -= dt; if (a.busy <= 0) { a.busy = 0; a.say = ''; const f = a.then; a.then = null; if (f) f(); } return; }
    if (a.id === 'dir' || a.pending) return;
    a.next -= dt; if (a.next > 0) return;
    a.next = 50 + Math.random() * 160;
    if (a.id === 'prod' && !pipeBusy) videoRun();
    else if (JOBS[a.id]) soloRun(a);
  });
}

// ================= реальные статусы =================
const real = {};
(async () => {
  try {
    const db = await claude.use('db'); if (!db) return;
    db.collection('status').onSnapshot(snap => {
      const seen = {};
      snap.docs.forEach(d => {
        const x = d.data(); if (!x || !byId[d.id]) return; seen[d.id] = 1;
        const prev = real[d.id]; real[d.id] = { state: String(x.state), task: String(x.task || '') };
        if (real[d.id].state === 'working' && (!prev || prev.task !== real[d.id].task || prev.state !== 'working')) logLine(`<b>${byId[d.id].n}</b>  LIVE: ${esc(real[d.id].task)}`, true);
      });
      Object.keys(real).forEach(id => { if (!seen[id]) delete real[id]; });
    }, () => {});
  } catch (e) { /* без базы показываем только модель */ }
})();

// ================= интерфейс =================
logLine('Сеть подключена, агенты онлайн');
if (welcome) { const w = document.createElement('div'); w.className = 'welcome'; w.textContent = welcome; document.body.appendChild(w); setTimeout(() => w.remove(), 7000); }
const card = document.getElementById('card'); let sel = null;
function renderCard() {
  if (!sel) { card.hidden = true; document.body.classList.remove('sel'); return; }
  const a = sel, s = st.agents[a.id], r = real[a.id], isLive = r && r.state === 'working';
  card.hidden = false; document.body.classList.add('sel');
  card.innerHTML = `<button class="close" type="button" aria-label="Закрыть">×</button>
    <div class="eyebrow">${DIST[a.d]}</div>
    <h3><i style="background:${a.c};box-shadow:0 0 12px ${a.c}"></i>${a.n}</h3>
    <p>${a.who}</p>
    <div class="kv"><div>Мощность<b>${s.lvl}</b></div><div>Выполнено<b>${s.done}</b></div><div>До роста<b>${Math.round(s.xp / need(s.lvl) * 100)}%</b></div></div>
    <div class="state ${isLive ? 'live' : ''}">${isLive ? 'LIVE · ' + esc(r.task) : a.busy > 0 ? 'обрабатывает: ' + esc(a.say) + ` · ${Math.ceil(a.busy)} с` : a.pending ? 'обмен данными с ядром' : 'ожидает задачу'}</div>`;
  card.querySelector('.close').onclick = () => { sel = null; renderCard(); };
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
canvas.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables, false)[0]; sel = hit ? byId[hit.object.userData.id] : null; renderCard();
});

// ================= день и ночь по настоящим часам =================
const skyNight = new THREE.Color(0x04050d), skyDusk = new THREE.Color(0x2a1a3a), skyDay = new THREE.Color(0x56698c), sky = new THREE.Color();
function daylight(now) {
  const h = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
  const alt = Math.sin((h - 6) / 12 * Math.PI);
  const day = THREE.MathUtils.clamp(alt * 1.8 + .15, 0, 1), dusk = THREE.MathUtils.clamp(1 - Math.abs(alt) * 3.5, 0, 1);
  sky.copy(skyNight).lerp(skyDay, day).lerp(skyDusk, dusk * .55);
  scene.background = sky; scene.fog.color.copy(sky); scene.fog.density = .011 - day * .004;
  const az = (h - 6) / 12 * Math.PI;
  sun.position.set(Math.cos(az) * 80, Math.max(6, alt * 90), 30); sun.intensity = day * 1.05;
  hemi.intensity = .18 + day * .55;
  const night = 1 - day;
  towerMats.forEach(m => m.emissiveIntensity = .35 + night * .9);
  bloom.strength = .3 + night * .8; bloom.threshold = .62 + day * .3;
  dust.material.opacity = .25 + night * .45;
}

// ================= цикл =================
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const v = new THREE.Vector3();
let last = performance.now(), cardT = 0, saveT = 0;
const clockEl = document.getElementById('clock'), dateEl = document.getElementById('date');
function frame(t) {
  const dt = Math.min(.1, (t - last) / 1000); last = t; const now = new Date();
  tick(dt); stepPackets(dt);
  if (!controls.autoRotate && !reduce) { idleT += dt; if (idleT > 25) controls.autoRotate = true; }
  let busy = 0, grew = false;
  AG.forEach(a => {
    const target = heightOf(a); if (Math.abs(target - a.h) > .01) { a.h += (target - a.h) * Math.min(1, dt * .8); grew = true; }
    a.tower.scale.y = a.h; a.edges.scale.y = a.h; a.crown.position.y = a.h + .06; a.tex.repeat.set(1, a.h / 10);
    corePos(a, a.core.position); a.core.position.y += Math.sin(t / 1400 + a.pos.x) * .25;
    const working = a.busy > 0; if (working) busy++;
    a.pulse = Math.max(0, (a.pulse || 0) - dt * 1.5);
    a.orb.scale.setScalar((working ? 1 + Math.sin(t / 260) * .08 : 1) + a.pulse * .35);
    a.shell.rotation.y += dt * (working ? 1.4 : .25); a.shell.rotation.x += dt * .1;
    a.ring1.rotation.z += dt * (working ? 1.8 : .3); a.ring2.rotation.y += dt * (working ? 1.2 : .2);
    if (a.extra) { a.extra[0].rotation.z += dt * .2; a.extra[1].rotation.z -= dt * .15; }
    a.halo.material.opacity = (working ? .85 : .45) + a.pulse * .4;
    const r = real[a.id], isLive = !!(r && r.state === 'working');
    a.live.visible = isLive; if (isLive) { a.live.rotation.z += dt; a.live.material.opacity = .6 + Math.sin(t / 220) * .35; }
    v.copy(a.core.position); v.y += a.R * 2.4; v.project(camera);
    const vis = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05; a.tag.hidden = !vis;
    if (vis) {
      a.tag.style.left = ((v.x + 1) / 2 * innerWidth).toFixed(1) + 'px'; a.tag.style.top = ((1 - v.y) / 2 * innerHeight).toFixed(1) + 'px';
      const sub = isLive ? 'LIVE · ' + r.task : working ? a.say : '';
      const html = `<b>${a.n}</b>${sub ? `<small>${esc(sub)}</small>` : ''}`;
      if (a.tag._h !== html) { a.tag.innerHTML = html; a.tag._h = html; a.tag.className = 'tag' + (isLive ? ' live' : ''); }
    }
  });
  if (grew) updateLinks();
  dust.rotation.y += dt * .01;
  daylight(now);
  controls.update(); composer.render();
  clockEl.textContent = hhmmss(now);
  dateEl.textContent = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  if (st.day !== today()) { st.day = today(); st.tasksToday = 0; }
  document.getElementById('mTasks').textContent = st.tasksToday;
  document.getElementById('mVid').textContent = st.videos;
  document.getElementById('mLoad').textContent = Math.round(busy / (AG.length - 1) * 100) + '%';
  cardT += dt; if (cardT > .5 && sel) { cardT = 0; renderCard(); }
  saveT += dt; if (saveT > 10) { saveT = 0; persist(); }
  requestAnimationFrame(frame);
}
addEventListener('pagehide', persist);
requestAnimationFrame(frame);
})();
</script>
